name: Build Codex plugin ZIPs

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: codex-plugin-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and verify platform ZIPs
        run: |
          version=$(python3 -c 'import json; print(json.load(open("plugins/cat-two-notes/plugin.json"))["version"])')
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          python3 -B scripts/build_release.py --platform all --format both
          (cd dist && sha256sum --check ./*.zip.sha256)
          smoke_dir=$(mktemp -d)
          unzip -q "dist/cat-two-notes-$version-linux-x64-plugin.zip" -d "$smoke_dir"
          test -f "$smoke_dir/plugin.json"
          test -f "$smoke_dir/mcp.json"
          test ! -e "$smoke_dir/.agents"
          test ! -e "$smoke_dir/plugins"
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"cat_two_settings_read","arguments":{}}}' \
            '{"jsonrpc":"2.0","id":4,"method":"resources/read","params":{"uri":"ui://cat-two-notes/setup.html"}}' \
            | "$smoke_dir/runtime/bin/python3" -E -s -B "$smoke_dir/scripts/server.py" \
            | python3 -c 'import json, sys
          init, listing, settings, form = map(json.loads, sys.stdin)
          assert init["result"]["serverInfo"]["version"] == sys.argv[1]
          capability = init["result"]["capabilities"]["extensions"]["openai/settings"]
          tools = {tool["name"]: tool for tool in listing["result"]["tools"]}
          assert {"cat_two_connection_status", "cat_two_open_setup", capability["readTool"], capability["updateTool"]} <= tools.keys()
          assert tools["cat_two_setup_save"]["_meta"]["ui"]["visibility"] == ["app"]
          page = settings["result"]["structuredContent"]
          assert page["schema"]["properties"] == page["values"] == {}
          action = page["layout"][0]["items"][0]["tool"]
          resource = form["result"]["contents"][0]
          assert tools[action]["_meta"]["ui"]["resourceUri"] == resource["uri"]
          assert resource["mimeType"] == "text/html;profile=mcp-app"
          assert "cat_two_setup_save" in resource["text"]
          ' "$version"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cat-two-notes-platform-packages
          path: dist/cat-two-notes-*.zip*
          if-no-files-found: error
          compression-level: 0
  windows-setup:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cat-two-notes-platform-packages
          path: dist
      - name: Verify the packaged Windows connection window
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter '*-windows-x64.zip' | Select-Object -First 1
          $extract = Join-Path $env:RUNNER_TEMP 'Cat Two 测试'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $extract
          $root = Join-Path $extract $zip.BaseName
          $launcher = Join-Path $root 'setup-cat-two.cmd'
          if (-not (Select-String -LiteralPath $launcher -Pattern 'setup-window' -Quiet)) {
            throw 'The launcher does not use the native window.'
          }
          $plugin = Join-Path $root 'plugins/cat-two-notes'
          $runtime = Join-Path $plugin 'runtime/python.exe'
          $smoke = Join-Path $env:RUNNER_TEMP 'cat-two-window-smoke.py'
          @'
          import socket
          import sys
          import tempfile
          import tkinter as tk
          from pathlib import Path
          from unittest.mock import patch

          sys.path.insert(0, sys.argv[1])
          import settings
          from setup_window import SetupWindow

          with tempfile.TemporaryDirectory() as profile:
              config = Path(profile) / "connection.json"
              with patch.object(settings, "_settings_path", return_value=config), patch.object(
                  socket, "create_connection", side_effect=AssertionError("Settings went online")
              ):
                  root = tk.Tk()
                  try:
                      form = SetupWindow(root)
                      root.update()
                      assert root.winfo_viewable() and form.token_entry.cget("show")
                      form.endpoint.set("https://cat-two.example.invalid")
                      form.token.set("cat_two_fixture")
                      form.save_button.invoke()
                      assert settings.load_settings() == ("https://cat-two.example.invalid/mcp", "cat_two_fixture")
                      assert form.token.get() == ""
                  finally:
                      root.destroy()
          '@ | Set-Content -LiteralPath $smoke -Encoding utf8
          & $runtime -X utf8 -E -s -B $smoke (Join-Path $plugin 'scripts')
          if ($LASTEXITCODE -ne 0) { throw 'The Windows connection form failed.' }
  release:
    if: github.ref_type == 'tag'
    needs: [build, windows-setup]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cat-two-notes-platform-packages
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum --check ./*.zip.sha256)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' > published-assets.txt; then
            for asset in dist/*.zip dist/*.zip.sha256; do
              if ! grep -Fxq "${asset##*/}" published-assets.txt; then
                gh release upload "$GITHUB_REF_NAME" "$asset" --repo "$GITHUB_REPOSITORY"
              fi
            done
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.zip.sha256 \
              --verify-tag --repo "$GITHUB_REPOSITORY" \
              --title "Cat_two 笔记 · Codex 插件 $GITHUB_REF_NAME" \
              --notes '安装后点「设置 Cat_two 笔记」，或从插件设置的「服务端连接 → 添加或修改服务端」打开内嵌表单。保存配置时不访问服务端。Windows 市场包的 `setup-cat-two.cmd` 也可直接打开本机配置窗口。'
          fi
