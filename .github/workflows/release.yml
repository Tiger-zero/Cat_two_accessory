name: Build Codex plugin ZIPs

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: codex-plugin-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and verify platform ZIPs
        run: |
          version=$(python3 -c 'import json; print(json.load(open("plugins/cat-two-notes/plugin.json"))["version"])')
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          python3 -B scripts/build_release.py --platform all --format both
          (cd dist && sha256sum --check ./*.zip.sha256)
          smoke_dir=$(mktemp -d)
          unzip -q "dist/cat-two-notes-$version-linux-x64-plugin.zip" -d "$smoke_dir"
          test -f "$smoke_dir/plugin.json"
          test -f "$smoke_dir/mcp.json"
          test ! -e "$smoke_dir/.agents"
          test ! -e "$smoke_dir/plugins"
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"cat_two_settings_read","arguments":{}}}' \
            | "$smoke_dir/runtime/bin/python3" -E -s -B "$smoke_dir/scripts/server.py" \
            | python3 -c 'import json, sys
          init, listing, settings = map(json.loads, sys.stdin)
          assert init["result"]["serverInfo"]["version"] == sys.argv[1]
          capability = init["result"]["capabilities"]["extensions"]["openai/settings"]
          names = {tool["name"] for tool in listing["result"]["tools"]}
          assert {"cat_two_connection_status", "cat_two_open_setup", capability["readTool"], capability["updateTool"]} <= names
          page = settings["result"]["structuredContent"]
          assert page["schema"]["properties"] == page["values"] == {}
          assert page["layout"][0]["items"][0]["tool"] == "cat_two_open_setup"
          ' "$version"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cat-two-notes-platform-packages
          path: dist/cat-two-notes-*.zip*
          if-no-files-found: error
          compression-level: 0
  windows-setup:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cat-two-notes-platform-packages
          path: dist
      - name: Verify the Windows setup launcher
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter '*-windows-x64.zip' | Select-Object -First 1
          $extract = Join-Path $env:RUNNER_TEMP 'Cat Two 测试'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $extract
          $launcher = Join-Path (Join-Path $extract $zip.BaseName) 'setup-cat-two.cmd'
          if (-not (Test-Path -LiteralPath $launcher)) { throw "Missing launcher: $launcher" }
          $output = Join-Path $env:RUNNER_TEMP 'cat-two-setup-output.txt'
          $errors = Join-Path $env:RUNNER_TEMP 'cat-two-setup-errors.txt'
          $process = Start-Process -FilePath $env:ComSpec -ArgumentList ('/d /s /c ""{0}""' -f $launcher) `
            -NoNewWindow -RedirectStandardOutput $output -RedirectStandardError $errors -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(35)
            $url = ''
            do {
              Start-Sleep -Milliseconds 500
              $text = Get-Content -LiteralPath $output -Raw
              if ($text) { $url = [regex]::Match($text, 'http://127\.0\.0\.1:\d+/setup/[\w-]+').Value }
            } until ($url -or $process.HasExited -or (Get-Date) -gt $deadline)
            if (-not $url) {
              if ($text) { Write-Output $text }
              Get-Content -LiteralPath $errors
              throw 'The launcher did not produce a setup URL.'
            }
            $page = Invoke-WebRequest -Uri $url -TimeoutSec 10 -NoProxy
            if ($page.StatusCode -ne 200 -or -not $page.Content.Contains('name="token"')) {
              throw 'The launcher did not serve the Cat_two setup form.'
            }
          } finally {
            if (-not $process.HasExited) { taskkill /PID $process.Id /T /F | Out-Null }
          }
  release:
    if: github.ref_type == 'tag'
    needs: [build, windows-setup]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cat-two-notes-platform-packages
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum --check ./*.zip.sha256)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' > published-assets.txt; then
            for asset in dist/*.zip dist/*.zip.sha256; do
              if ! grep -Fxq "${asset##*/}" published-assets.txt; then
                gh release upload "$GITHUB_REF_NAME" "$asset" --repo "$GITHUB_REPOSITORY"
              fi
            done
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.zip.sha256 \
              --verify-tag --repo "$GITHUB_REPOSITORY" \
              --title "Cat_two 笔记 · Codex 插件 $GITHUB_REF_NAME" \
              --notes '安装后点「设置」运行首次引导。后续从插件设置的「服务端连接 → 添加或修改服务端」打开本机表单。Windows 市场包也提供 `setup-cat-two.cmd`。单插件导入包文件名以 `-plugin.zip` 结尾。'
          fi
