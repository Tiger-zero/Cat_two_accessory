name: Release Codex plugin

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and verify ZIP
        run: |
          python3 -B scripts/build_release.py
          cd dist
          sha256sum --check "cat-two-notes-${GITHUB_REF_NAME#v}.zip.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="cat-two-notes-${GITHUB_REF_NAME#v}.zip"
          gh release create "$GITHUB_REF_NAME" "dist/$asset" "dist/$asset.sha256" \
            --verify-tag --repo "$GITHUB_REPOSITORY" \
            --title "Cat_two 笔记 · Codex 插件 $GITHUB_REF_NAME" \
            --notes '解压 ZIP 后，按包内 README 安装。在 Codex 输入 `@Cat_two`，首次连接时填写应用地址和 MCP 令牌。'
